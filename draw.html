<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>구역 그리기 도구</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    #bar { padding: 10px 12px; border-bottom: 1px solid #e5e5e5; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
    button { padding: 6px 12px; font-size: 14px; cursor: pointer; }
    #map { width: 100%; height: calc(100% - 150px); }
    #out { width: 100%; height: 90px; box-sizing: border-box; font-size: 12px; }
  </style>
</head>
<body>
  <div id="bar">
    <span>지도를 클릭해서 구역 꼭짓점을 순서대로 찍으세요.</span>
    <button id="undo">한 점 되돌리기</button>
    <button id="reset">초기화</button>
    <button id="copy">좌표 복사</button>
    <span id="cnt">0점</span>
  </div>
  <div id="map"></div>
  <textarea id="out" readonly placeholder="찍은 좌표가 여기에 표시됩니다"></textarea>

  <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=wm4v4sv5oq"
          onerror="document.getElementById('map').textContent='네이버 지도 스크립트를 불러오지 못했습니다.'"></script>
  <script>
    if (typeof naver !== 'undefined') {
      var map = new naver.maps.Map('map', {
        center: new naver.maps.LatLng(37.5065, 126.9890),
        zoom: 15
      });
      var pts = [];
      var poly = new naver.maps.Polygon({
        map: map, paths: [[]],
        strokeColor: '#e11d48', strokeWeight: 3,
        fillColor: '#e11d48', fillOpacity: 0.15
      });
      var markers = [];

      function render() {
        poly.setPaths([pts.slice()]);
        document.getElementById('cnt').textContent = pts.length + '점';
        var arr = pts.map(function (p) {
          return [Number(p.lat().toFixed(6)), Number(p.lng().toFixed(6))];
        });
        document.getElementById('out').value = JSON.stringify(arr);
      }

      naver.maps.Event.addListener(map, 'click', function (e) {
        pts.push(e.coord);
        markers.push(new naver.maps.Marker({ position: e.coord, map: map }));
        render();
      });

      document.getElementById('undo').onclick = function () {
        pts.pop();
        var m = markers.pop();
        if (m) m.setMap(null);
        render();
      };
      document.getElementById('reset').onclick = function () {
        pts = [];
        markers.forEach(function (m) { m.setMap(null); });
        markers = [];
        render();
      };
      document.getElementById('copy').onclick = function () {
        var t = document.getElementById('out');
        t.select();
        document.execCommand('copy');
      };
    }
  </script>
</body>
</html>
