<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>머니마인드</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    header { padding: 12px 16px; border-bottom: 1px solid #e5e5e5; font-weight: 600; }
    #map { width: 100%; height: calc(100% - 49px); }
  </style>
</head>
<body>
  <header>머니마인드</header>
  <div id="map"></div>

  <!-- 네이버 지도 공개용 Client ID (등록한 도메인에서만 동작) -->
  <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=wm4v4sv5oq"
          onerror="document.getElementById('map').textContent='네이버 지도 스크립트를 불러오지 못했습니다. (네트워크/광고 차단/키 확인)'"></script>
  <script>
    if (typeof naver === 'undefined') {
      console.error('naver 객체 없음: maps.js 로드 실패. 개발자도구 Network 탭에서 maps.js 응답 확인');
    } else {
    // 반포 권역 대략적인 중심 좌표 (이후 타깃 구역에 맞춰 조정)
    var map = new naver.maps.Map('map', {
      center: new naver.maps.LatLng(37.5065, 126.9890),
      zoom: 15
    });

    // 타깃 구역 (반포 권역, 빨간 선 범위)
    var areaPath = [[37.504174,126.980396],[37.502403,126.981125],[37.500258,126.985073],[37.498386,126.987219],[37.498045,126.992841],[37.498828,126.995158],[37.500292,126.998978],[37.502233,127.002797],[37.509314,126.998634]]
      .map(function (p) { return new naver.maps.LatLng(p[0], p[1]); });

    var area = new naver.maps.Polygon({
      map: map,
      paths: [areaPath],
      strokeColor: '#e11d48',
      strokeWeight: 3,
      fillColor: '#e11d48',
      fillOpacity: 0.12
    });

    map.fitBounds(area.getBounds());
    }
  </script>
</body>
</html>
